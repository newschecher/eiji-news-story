<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>速報ストーリーメーカー</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI","Meiryo",sans-serif;background:#1b1b1f;color:#eee;display:flex;gap:24px;padding:20px;min-height:100vh;flex-wrap:wrap;justify-content:center}
.panel{width:380px;max-width:100%}
h1{font-size:18px;margin:0 0 14px}
label{display:block;font-size:12px;color:#aaa;margin:12px 0 4px}
input[type=text],textarea{width:100%;padding:8px;border-radius:6px;border:1px solid #444;background:#2a2a30;color:#fff;font:inherit;font-size:14px}
textarea{resize:vertical;min-height:64px}
input[type=range]{width:100%}
input[type=color]{width:100%;height:34px;border:0;background:none;padding:0}
.row{display:flex;gap:8px}.row>*{flex:1}
button{padding:12px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;background:#0b5a35;color:#fff;margin-top:10px;width:100%}
button.sub{background:#3a3a42}
button:disabled{opacity:.5;cursor:default}
.preview{display:flex;flex-direction:column;align-items:center;gap:8px}
canvas{height:min(88vh,860px);aspect-ratio:9/16;border-radius:10px;box-shadow:0 4px 30px #000a;background:#000}
.hint{font-size:11px;color:#888}
#status{font-size:12px;color:#8fd;min-height:16px}
h2{font-size:13px;margin:18px 0 0;border-top:1px solid #333;padding-top:12px;color:#ccc}
</style>
</head>
<body>
<div class="panel">
  <h1>📰 英字新聞編集委員会 速報ストーリーメーカー</h1>

  <label>設定(文字・位置・色・濃さ)</label>
  <div class="row">
    <button class="sub" id="p-default" style="margin-top:0">デフォルトに戻す</button>
    <button class="sub" id="p-load" style="margin-top:0">カスタムを読込</button>
  </div>
  <button class="sub" id="p-save" style="margin-top:8px">現在の設定をカスタムとして保存</button>
  <div id="presetmsg" class="hint" style="min-height:16px;color:#8fd"></div>

  <label>場所・タイトル(左上の帯)</label>
  <input type="text" id="place" value="青山キャンパス14号館">
  <div class="row">
    <div><label>日付</label><input type="text" id="date"></div>
    <div><label>ラベル</label><input type="text" id="label" value="速報"></div>
  </div>

  <label>見出し</label>
  <textarea id="headline">プロ野球のドラフト会議が開催中!!</textarea>
  <label>英語見出し(任意・小さく表示)</label>
  <input type="text" id="english" value="">
  <label>見出しの大きさ <span id="hsv"></span></label>
  <input type="range" id="hsize" min="40" max="110" value="68">

  <label>見出しの位置(上下) — プレビューを上下にドラッグしても動かせます(上の帯の付近をドラッグすると帯が動きます)</label>
  <input type="range" id="ypos" min="500" max="1700" value="1640">

  <label>場所・日付の位置(上下)</label>
  <input type="range" id="topy" min="80" max="1000" value="190">

  <label>場所・日付の帯の濃さ <span id="tav"></span></label>
  <input type="range" id="topalpha" min="0" max="100" value="100">

  <div class="row">
    <div><label>メインカラー</label><input type="color" id="main" value="#0b4a2a"></div>
    <div><label>見出し枠の色</label><input type="color" id="boxc" value="#e6e6e6"></div>
  </div>

  <h2>素材</h2>
  <label>背景の動画 / 写真</label>
  <input type="file" id="bg" accept="video/*,image/*">
  <div class="row"><button class="sub" id="pp">⏯ 再生/停止</button><button class="sub" id="mute">🔇 音: オフ</button></div>
  <label>素材の使う範囲(秒) <span id="vdur"></span></label>
  <div class="row"><input type="number" id="tstart" min="0" step="0.1" placeholder="開始" value="0"><input type="number" id="tend" min="0" step="0.1" placeholder="終了"></div>
  <label>完成動画の長さ(秒・空欄=使う範囲と同じ。写真は6秒 / 最大60)</label>
  <input type="number" id="outlen" min="1" max="60" step="0.5" placeholder="自動">
  <p class="hint">完成動画の長さが範囲より長い場合は範囲を繰り返し、短い場合は途中で切ります。</p>
  <label>ロゴ(右上・任意)</label>
  <input type="file" id="logo" accept="image/*">

  <h2>書き出し</h2>
  <button class="sub" id="replay">▶ 登場アニメを再生(写真・プレビュー用)</button>
  <button id="dl">画像(PNG)を保存 — 現在のフレーム</button>
  <button id="rec">動画を書き出し(最初から最後まで)</button>
  <button id="saveVid" style="display:none">📱 完成した動画を写真アプリに保存</button>
  <div id="status"></div>
  <p class="hint">動画の書き出しは再生と同じ長さがかかります(ブラウザの録画機能を使用)。ストーリーは60秒までが目安です。入力内容は自動保存されます(素材ファイルは除く)。</p>
</div>

<div class="preview">
  <canvas id="cv" width="1080" height="1920"></canvas>
</div>

function nowStr(){const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}

function wrap(text,maxW){
  const lines=[];
  for(const para of text.split('\n')){
    let line='';
    const tokens=para.match(/[A-Za-z0-9'’.,:;!?\-]+\s*|[\s\S]/g)||[''];
    for(const t of tokens){
      if(ctx.measureText(line+t).width>maxW&&line){lines.push(line.trimEnd());line=t}
      else line+=t;
    }
    lines.push(line.trimEnd());
  }
  return lines;
}

function cover(src,sw,sh,pan){
  // pan(0〜1)を指定すると、少し拡大して左から右へゆっくり動かす(写真用)
  const s=Math.max(W/sw,H/sh)*(pan===undefined?1:1.15),w=sw*s,h=sh*s;
  const x=pan===undefined?(W-w)/2:-(w-W)*(1-pan);
  ctx.drawImage(src,x,(H-h)/2,w,h);
}
function imgPan(){
  if(recording){const q=Math.min(1,(performance.now()-recStart)/1000/outLen());return q*q*(3-2*q)}
  return .5-.5*Math.cos(Math.PI*(performance.now()-animStart)/1000/8); // プレビューは往復
}

  else if(bgImg) cover(bgImg,bgImg.width,bgImg.height,imgPan());
  else{ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)}

  // 左からスライドイン(場所 → 日付 → ラベル → 本文の順)
  const t=animT();
  const ease=(d,l)=>{const p=Math.min(1,Math.max(0,(t-d)/l));return 1-Math.pow(1-p,3)};

  // 左上: 場所の帯 + 日付
  ctx.textBaseline='middle';ctx.textAlign='left';
  const TOP=+$('topy').value,TA=$('topalpha').value/100;
  $('tav').textContent=$('topalpha').value+'%';
  ctx.font=`900 52px ${SANS}`;
  const pw=ctx.measureText($('place').value).width+90;
  ctx.save();ctx.translate(-(1-ease(0,0.55))*(pw+20),0);
  ctx.globalAlpha=TA;ctx.fillStyle=main;ctx.fillRect(0,TOP,pw,96);ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.fillText($('place').value,45,TOP+50);
  ctx.restore();
  ctx.font=`700 30px ${SERIF}`;
  const dw=ctx.measureText($('date').value).width+60;
  ctx.save();ctx.translate(-(1-ease(0.15,0.55))*(dw+20),0);
  ctx.globalAlpha=TA*.92;ctx.fillStyle='rgb(225,225,225)';ctx.fillRect(0,TOP+96,dw,52);ctx.globalAlpha=1;
  ctx.fillStyle='#222';ctx.fillText($('date').value,30,TOP+123);
  ctx.restore();

  // 右上: ロゴ
  if(logoImg){
    const s=190/Math.max(logoImg.width,logoImg.height);
    ctx.drawImage(logoImg,W-60-logoImg.width*s,TOP-10,logoImg.width*s,logoImg.height*s);
  }

  // 下: 見出し枠(下端固定で上へ伸びる)
  const BOTTOM=+$("ypos").value,MX=50,PAD=40,BW=W-MX*2;
  const hs=+$('hsize').value;
  ctx.font=`900 ${hs}px ${SANS}`;
  const hl=wrap($('headline').value,BW-PAD*2);
  const en=$('english').value.trim();
  const es=Math.round(hs*0.45);
  let enL=[];
  if(en){ctx.font=`italic 700 ${es}px ${SERIF}`;enL=wrap(en,BW-PAD*2)}
  const hh=hl.length*hs*1.3,eh=enL.length?enL.length*es*1.3+10:0;
  const boxH=hh+eh+PAD*2-10;
  const boxY=BOTTOM-boxH;
  const offL=-(1-ease(0.45,0.55))*W,offB=-(1-ease(0.8,0.65))*W;

  // ラベル(枠の左上に乗る)
  ctx.save();ctx.translate(offL,0);
  ctx.font=`900 36px ${SANS}`;
  const lw=ctx.measureText($('label').value).width+70;
  ctx.fillStyle=main;ctx.fillRect(MX,boxY-62,lw,62);
  ctx.fillStyle='#fff';ctx.fillText($('label').value,MX+35,boxY-30);
  ctx.restore();

  ctx.save();ctx.translate(offB,0);
  ctx.fillStyle=$('boxc').value;ctx.globalAlpha=.93;ctx.fillRect(MX,boxY,BW,boxH);ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.fillStyle=main;
  let y=boxY+PAD-5+hs*0.65;
  ctx.font=`900 ${hs}px ${SANS}`;
  for(const l of hl){ctx.fillText(l,W/2,y);y+=hs*1.3}
  if(enL.length){
    y+=10-hs*0.65+es*0.65;
    ctx.font=`italic 700 ${es}px ${SERIF}`;ctx.fillStyle='#333';
    for(const l of enL){ctx.fillText(l,W/2,y);y+=es*1.3}
  }
  ctx.restore();
  ctx.textAlign='left';
}

let boxHalf=0;
let animStart=performance.now();
function animT(){
  if(recording)return(performance.now()-recStart)/1000;
  if(vid)return vid.paused?99:Math.max(0,vid.currentTime-tS());
  return(performance.now()-animStart)/1000;
}

let recStart=0;
const tS=()=>Math.max(0,+$('tstart').value||0);
const tE=()=>{const e=+$('tend').value;return vid&&e>tS()+0.1&&e<=vid.duration?e:(vid?vid.duration:0)};
const outLen=()=>Math.min(60,+$('outlen').value||(vid?tE()-tS():6));
function loop(){
  // 選択した範囲(開始〜終了)でループ
  if(vid&&(vid.ended||(!vid.paused&&vid.currentTime>=tE()-0.04))){vid.currentTime=tS();vid.play()}
  draw();requestAnimationFrame(loop);
}

function save(){try{localStorage.setItem('eiji-story2',JSON.stringify(Object.fromEntries(fields.map(f=>[f,$(f).value]))))}catch(e){}}
const DEFAULTS=Object.fromEntries(fields.map(f=>[f,$(f).value]));
try{const s=JSON.parse(localStorage.getItem('eiji-story2')||'{}');for(const f of fields)if(s[f]!==undefined)$(f).value=s[f]}catch(e){}
if(!$('date').value)$('date').value=nowStr();
fields.forEach(f=>$(f).addEventListener('input',save));

// 設定プリセット(デフォルト / カスタム)
function applySettings(o){
  for(const f of fields)if(o[f]!==undefined)$(f).value=o[f];
  if(!$('date').value)$('date').value=nowStr();
  save();
}
const setMsg=t=>{$('presetmsg').textContent=t;setTimeout(()=>$('presetmsg').textContent='',2500)};
$('p-default').onclick=()=>{applySettings(DEFAULTS);setMsg('デフォルトの設定に戻しました')};
$('p-save').onclick=()=>{
  try{localStorage.setItem('eiji-custom',JSON.stringify(Object.fromEntries(fields.map(f=>[f,$(f).value]))));setMsg('現在の設定をカスタムとして保存しました')}
  catch(e){setMsg('保存できませんでした')}
};
$('p-load').onclick=()=>{
  try{const c=JSON.parse(localStorage.getItem('eiji-custom')||'null');
    if(!c){setMsg('カスタム設定がまだ保存されていません');return}
    applySettings(c);setMsg('カスタム設定を読み込みました')}
  catch(e){setMsg('読み込めませんでした')}
};

$('bg').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  if(vid){vid.pause();vid.remove();vid=null}bgImg=null;
  if(f.type.startsWith('video/')||/\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name)){
    // スマホでは画面に載っていない video は読み込まれないことがあるため、見えない状態で DOM に置く
    const v=document.createElement('video');
    v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
    v.preload='auto';v.loop=false;v.muted=$('mute').dataset.on!=='1';v.playsInline=true;
    v.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
    document.body.appendChild(v);
    $('status').textContent='動画を読み込み中…';
    let started=false;
    const start=()=>{
      if(started||!v.duration||!isFinite(v.duration))return;started=true;
      vid=v;
      $('tstart').value=0;$('tend').value=Math.floor(v.duration*10)/10;$('outlen').value='';
      $('vdur').textContent=`(元動画 ${v.duration.toFixed(1)}秒)`;
      $('status').textContent='';
      v.play().catch(()=>{$('status').textContent='「再生/停止」ボタンを押すと再生されます'});
    };
    v.onloadedmetadata=start;v.onloadeddata=start;v.oncanplay=start;
    v.onerror=()=>{$('status').textContent='この動画は読み込めませんでした(形式が未対応の可能性があります)'};
    v.src=url;v.load();
    // iPhone は preload を無視して play() されるまで読み込まないので、すぐ再生を試みる
    const p=v.play();if(p&&p.catch)p.catch(()=>{});
    let tries=0;
    const poll=setInterval(()=>{
      if(started||v!==vid&&started){clearInterval(poll);return}
      start();
      if(!started&&++tries>75){clearInterval(poll);$('status').textContent='動画を読み込めませんでした。別の動画で試すか、再度ファイルを選んでください'}
    },200);
  }else{const i=new Image();i.onload=()=>bgImg=i;i.src=url}
});
$('logo').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f){logoImg=null;return}
  const i=new Image();i.onload=()=>logoImg=i;i.src=URL.createObjectURL(f);
});
{let drag=false;
let dragEl='ypos';
const mv=e=>{const r=cv.getBoundingClientRect();const lim=dragEl==='ypos'?[500,1700]:[80,1000];$(dragEl).value=Math.round(Math.min(lim[1],Math.max(lim[0],(e.clientY-r.top)/r.height*H+boxHalf)));save()};
cv.style.cursor='ns-resize';cv.style.touchAction='none';
cv.addEventListener('pointerdown',e=>{drag=true;cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();const cy=(e.clientY-r.top)/r.height*H,ty=+$('topy').value;dragEl=(cy>ty-40&&cy<ty+190)?'topy':'ypos';boxHalf=+$(dragEl).value-cy;});
cv.addEventListener('pointermove',e=>{if(drag)mv(e)});
cv.addEventListener('pointerup',()=>drag=false);}
$('replay').onclick=()=>{animStart=performance.now();if(vid){vid.currentTime=tS();vid.play()}};
['tstart','tend'].forEach(id=>$(id).addEventListener('change',()=>{if(vid){vid.currentTime=tS();vid.play()}}));
$('pp').onclick=()=>{if(vid)vid.paused?vid.play():vid.pause()};
$('mute').onclick=()=>{
  const on=$('mute').dataset.on==='1';
  $('mute').dataset.on=on?'':'1';
  $('mute').textContent=on?'🔇 音: オフ':'🔊 音: オン';
  if(vid)vid.muted=on;
};

// スマホでは共有シートを開く(「画像を保存」「ビデオを保存」で写真アプリに入る)。PCは通常のダウンロード
const isTouch=matchMedia('(pointer:coarse)').matches;
function canShareFile(file){return isTouch&&navigator.canShare&&navigator.canShare({files:[file]})}
function download(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
async function saveFile(file){
  if(canShareFile(file)){
    try{await navigator.share({files:[file]});return 'shared'}
    catch(e){if(e.name==='AbortError')return 'cancel'}
  }
  download(file,file.name);return 'downloaded';
}
let pendingVideo=null;
$('saveVid').onclick=async()=>{
  if(!pendingVideo)return;
  const r=await saveFile(pendingVideo);
  if(r==='shared')$('status').textContent='共有メニューから「ビデオを保存」を選ぶと写真アプリに入ります';
};
$('dl').onclick=()=>{
  cv.toBlob(async b=>{
    const file=new File([b],`story_${Date.now()}.png`,{type:'image/png'});
    const r=await saveFile(file);
    if(r==='shared')$('status').textContent='共有メニューから「画像を保存」を選ぶと写真アプリに入ります';
  },'image/png');
};

$('rec').onclick=async()=>{
  if(!vid&&!bgImg){$('status').textContent='先に背景の動画か写真を選んでください';return}
  if(recording)return;
  recording=true;$('rec').disabled=true;$('saveVid').style.display='none';
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const ext=mime.includes('mp4')?'mp4':'webm';
  const stream=cv.captureStream(30);
  try{
    const vs=(vid&&vid.captureStream?vid.captureStream():null);
    if(vs)vs.getAudioTracks().forEach(t=>stream.addTrack(t));
  }catch(e){}
  const chunks=[];
  const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6});
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const done=new Promise(r=>mr.onstop=r);
  const total=outLen();
  if(vid){
    vid.pause();vid.currentTime=tS();
    await new Promise(r=>{vid.onseeked=r;});
    vid.onseeked=null;
  }
  recStart=performance.now();
  mr.start();if(vid)await vid.play();
  // 範囲を超えたら loop() が先頭へ戻すので、指定の長さに達するまで録画
  const tick=setInterval(()=>$('status').textContent=`書き出し中… ${((performance.now()-recStart)/1000).toFixed(1)} / ${total.toFixed(1)}秒`,200);
  await new Promise(r=>setTimeout(r,total*1000));
  clearInterval(tick);mr.stop();await done;
  if(vid){vid.currentTime=tS();vid.play()}
  pendingVideo=new File([new Blob(chunks,{type:mime||'video/webm'})],`story_${Date.now()}.${ext}`,{type:mime.split(';')[0]||'video/webm'});
  const warn=ext==='webm'?' ※webm形式です。Instagramに上がらない場合はmp4に変換してください':'';
  if(canShareFile(pendingVideo)){
    $('saveVid').style.display='block';
    $('status').textContent='書き出し完了。下の「写真アプリに保存」を押してください'+warn;
  }else{
    download(pendingVideo,pendingVideo.name);
    $('status').textContent=`保存しました (.${ext})`+warn;
  }
  recording=false;$('rec').disabled=false;
};

{const i=new Image();i.onload=()=>{if(logoImg)return;const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);const d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let k=0;k<a.length;k+=4){const m=Math.min(a[k],a[k+1],a[k+2]);if(m>235)a[k+3]=0;else if(m>200)a[k+3]=Math.round(255*(235-m)/35)}x.putImageData(d,0,0);logoImg=c};i.src=DEFAULT_LOGO}
(document.fonts&&document.fonts.ready||Promise.resolve()).then(loop);
